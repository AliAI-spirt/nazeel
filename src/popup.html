<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إحصائيات النزلاء</title>
<style>
  :root{
    --ink:#14213d; --ink2:#2c3e63; --brass:#b8832a; --brass-bg:#fbf1dc;
    --jade:#1f7a5a; --jade-bg:#dff3ea; --rust:#b4452c; --rust-bg:#fbe4dd;
    --bg:#eef1f6; --card:#fff; --line:#d5dbe6; --mute:#5b6882;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif}
  body{width:460px;background:var(--bg);color:var(--ink);font-size:12px}
  button,input,select{font-size:12px}
  .num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

  header{background:var(--ink);color:#fff;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--brass)}
  header h1{font-size:14px;font-weight:700}
  header small{display:block;color:#aeb9d1;font-size:10px;margin-top:2px}
  .ghost{background:transparent;border:1px solid #4a5b82;color:#dfe5f2;border-radius:5px;padding:4px 9px;cursor:pointer}
  .ghost:hover{background:var(--rust);border-color:var(--rust);color:#fff}

  .panel{padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line)}
  .mode{display:flex;gap:10px;align-items:center;margin-bottom:9px}
  .mode b{display:block;font-size:12px}
  .mode small{color:var(--mute);font-size:10.5px;line-height:1.4}
  .switch{position:relative;width:38px;height:22px;flex:none}
  .switch input{opacity:0;width:0;height:0;position:absolute}
  .switch span{position:absolute;inset:0;background:#b9c2d3;border-radius:22px;cursor:pointer;transition:.18s}
  .switch span::before{content:"";position:absolute;width:16px;height:16px;top:3px;right:3px;background:#fff;border-radius:50%;transition:.18s}
  .switch input:checked+span{background:var(--jade)}
  .switch input:checked+span::before{transform:translateX(-16px)}
  .switch input:focus-visible+span{outline:2px solid var(--brass);outline-offset:2px}

  .btns{display:flex;gap:6px}
  .btn{flex:1;padding:9px 6px;border:none;border-radius:6px;cursor:pointer;font-weight:700;background:var(--ink);color:#fff}
  .btn:hover{background:var(--ink2)}
  .btn.alt{background:var(--brass-bg);color:#6d4b0f;border:1px solid #e3c88e}
  .btn.alt:hover{background:#f6e3b8}
  .btn:disabled{opacity:.5;cursor:wait}
  [hidden]{display:none!important}
  #status{margin-top:8px;font-size:11px;color:var(--mute);line-height:1.5;min-height:16px}
  #status.ok{color:var(--jade)} #status.err{color:var(--rust)}
  .progress{height:5px;background:#e3e8f1;border-radius:3px;overflow:hidden;margin-top:6px}
  .progress i{display:block;height:100%;background:var(--jade);width:0;transition:width .3s}

  .filters{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px;padding:9px 12px;background:#f7f9fc;border-bottom:1px solid var(--line)}
  .filters .wide{grid-column:1/-1}
  .filters input,.filters select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink)}
  .filters input:focus,.filters select:focus{outline:2px solid var(--brass);outline-offset:-1px}
  .filters .row{display:flex;gap:6px;align-items:center}
  .filters .hint{font-size:10px;color:var(--mute);flex:1}
  .link{background:none;border:none;color:var(--ink2);text-decoration:underline;cursor:pointer;font-size:11px}

  .tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
  .tabs button{flex:1;padding:8px 2px;border:none;background:none;cursor:pointer;color:var(--mute);font-weight:600;border-bottom:3px solid transparent}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--brass)}
  .tabs button:hover{background:#f3f5f9}

  #view{padding:10px 12px;max-height:330px;overflow-y:auto}
  #view::-webkit-scrollbar{width:4px} #view::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}

  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 8px;border-right:4px solid var(--ink)}
  .kpi.iq{border-right-color:var(--jade)} .kpi.fr{border-right-color:var(--brass)}
  .kpi .v{font-size:22px;font-weight:800;line-height:1.1}
  .kpi .l{font-size:10.5px;color:var(--mute);margin-top:1px}
  .kpi .s{font-size:10px;color:var(--mute);margin-top:2px}
  .kpis.small .kpi{border-right-width:1px;border-right-color:var(--line)}
  .kpis.small .v{font-size:16px}

  .split{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:2px 0 4px;background:#e3e8f1}
  .split i{display:block;height:100%} .split .a{background:var(--jade)} .split .b{background:var(--brass)}
  .legend{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mute);margin-bottom:9px}

  .sec{background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:8px;overflow:hidden}
  .sec h3{font-size:11.5px;padding:6px 9px;background:#f3f5f9;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;color:var(--ink2)}
  .sec .body{padding:6px 9px}
  .bar{display:grid;grid-template-columns:96px 1fr 28px;gap:6px;align-items:center;margin:4px 0;font-size:11px}
  .bar .t{height:8px;background:#e8ecf3;border-radius:4px;overflow:hidden}
  .bar .t i{display:block;height:100%;background:var(--ink2);border-radius:4px}
  .bar.g .t i{background:var(--brass)}
  .bar b{text-align:left}

  .alert{padding:6px 9px;border-radius:5px;margin-bottom:5px;font-size:11px;line-height:1.5}
  .alert.warn{background:var(--rust-bg);color:#7d2b19}
  .alert.info{background:#e8eefb;color:#243b73}

  .row-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 9px;background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:5px;cursor:pointer}
  .row-item:hover{border-color:var(--brass);background:#fffaf0}
  .row-item .nm{display:flex;align-items:center;gap:6px;font-weight:700}
  .row-item .meta{font-size:10.5px;color:var(--mute);font-weight:400}
  .pill{display:inline-block;padding:1px 6px;border-radius:9px;font-size:10px;font-weight:700}
  .pill.n{background:var(--jade-bg);color:var(--jade)} .pill.o{background:var(--brass-bg);color:#8a5c10}
  .pill.t{background:#e0e8fa;color:#1d3a82;min-width:22px;text-align:center}
  .code{font-size:9.5px;background:#eef1f6;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--mute)}

  .room-card{background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:6px;overflow:hidden}
  .room-card .hd{display:flex;justify-content:space-between;align-items:center;padding:6px 9px;background:#f3f5f9;cursor:pointer}
  .room-card .hd b{font-size:13px}
  .room-card ul{list-style:none;padding:4px 9px}
  .room-card li{display:flex;justify-content:space-between;gap:6px;padding:3px 0;border-bottom:1px dashed var(--line);font-size:11px}
  .room-card li:last-child{border:none}

  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);font-size:11px}
  th{background:#f3f5f9;text-align:right;padding:5px 6px;position:sticky;top:-10px;z-index:1;font-size:10.5px;color:var(--ink2)}
  td{padding:5px 6px;border-top:1px solid var(--line)}
  tr:hover td{background:#fffaf0}
  .empty{text-align:center;color:var(--mute);padding:26px 10px;line-height:1.8}

  footer{display:flex;gap:6px;padding:9px 12px;background:var(--card);border-top:1px solid var(--line)}
  footer button{flex:1;padding:7px 4px;border:1px solid var(--line);background:#f7f9fc;border-radius:6px;cursor:pointer;color:var(--ink);font-weight:600}
  footer button:hover{border-color:var(--brass);background:var(--brass-bg)}
  footer .main{background:var(--ink);color:#fff;border-color:var(--ink)} footer .main:hover{background:var(--ink2);color:#fff}
</style>
</head>
<body>

<header>
  <div><h1>إحصائيات النزلاء</h1><small id="subtitle">لم يتم التحليل بعد</small></div>
  <button id="resetBtn" class="ghost" title="مسح كل البيانات المحفوظة">مسح الكل</button>
</header>

<section class="panel">
  <div class="mode">
    <label class="switch"><input id="cumToggle" type="checkbox" aria-label="التجميع التراكمي"><span></span></label>
    <div>
      <b>التجميع التراكمي بين الصفحات</b>
      <small id="cumHint">مغلق: كل تحليل يستبدل النتيجة السابقة.</small>
    </div>
  </div>
  <div class="btns">
    <button id="calcBtn" class="btn">تحليل الصفحة الحالية</button>
    <button id="crawlBtn" class="btn alt" hidden>جمع كل الصفحات تلقائياً</button>
  </div>
  <div class="progress" id="progWrap" hidden><i id="prog"></i></div>
  <div id="status"></div>
</section>

<section class="filters" id="filters">
  <input id="fRooms" class="wide" placeholder="فلتر الغرف: 305 أو 301-308 أو 3* (طابق كامل) أو 103, 305" aria-label="فلتر رقم الغرفة">
  <select id="fStatus" aria-label="الحالة">
    <option value="all">كل الحالات</option><option value="new">وصلوا اليوم (جديد)</option><option value="old">سابقون (قديم)</option>
  </select>
  <select id="fNat" aria-label="النوع">
    <option value="all">عراقي وأجنبي</option><option value="iq">عراقيون</option><option value="foreign">أجانب</option>
  </select>
  <select id="fCountry" aria-label="الدولة"><option value="">كل الدول</option></select>
  <div class="row wide"><span class="hint" id="fHint"></span><button id="fClear" class="link">إزالة الفلاتر</button></div>
</section>

<nav class="tabs" id="tabs">
  <button data-tab="summary" class="on">الملخص</button>
  <button data-tab="countries">الجنسيات</button>
  <button data-tab="rooms">الغرف</button>
  <button data-tab="guests">النزلاء</button>
</nav>

<main id="view"><div class="empty">افتح صفحة النزلاء ثم اضغط «تحليل الصفحة الحالية».</div></main>

<footer>
  <button id="assistBtn" class="main" style="background:#b8832a;border-color:#b8832a">مساعد الإدخال</button>
  <button id="reportBtn" class="main">تقرير كامل</button>
  <button id="copyBtn">نسخ للواتساب</button>
  <button id="csvBtn">تصدير CSV</button>
</footer>

<script src="analysis.js"></script>
<script src="popup.js"></script>
</body>
</html>
